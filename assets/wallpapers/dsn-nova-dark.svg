<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1920"
    height="1080"
    viewBox="0 0 1920 1080"
    preserveAspectRatio="xMidYMid slice"
>
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#070B11"/>
            <stop offset="46%" stop-color="#101823"/>
            <stop offset="100%" stop-color="#070C13"/>
        </linearGradient>

        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#8FA3B7" stop-opacity="0.03"/>
            <stop offset="48%" stop-color="#D7E2EC" stop-opacity="0.16"/>
            <stop offset="100%" stop-color="#506376" stop-opacity="0.03"/>
        </linearGradient>

        <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#304153" stop-opacity="0.08"/>
            <stop offset="50%" stop-color="#AFC0D0" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#111A24" stop-opacity="0.06"/>
        </linearGradient>

        <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#D8E3ED" stop-opacity="0.44"/>
            <stop offset="100%" stop-color="#758B9F" stop-opacity="0.08"/>
        </linearGradient>

        <radialGradient id="blueGlow" cx="72%" cy="28%" r="55%">
            <stop offset="0%" stop-color="#3E7199" stop-opacity="0.16"/>
            <stop offset="48%" stop-color="#20374A" stop-opacity="0.07"/>
            <stop offset="100%" stop-color="#060A10" stop-opacity="0"/>
        </radialGradient>

        <pattern
            id="grid"
            width="96"
            height="96"
            patternUnits="userSpaceOnUse"
        >
            <path
                d="M 96 0 L 0 0 0 96"
                fill="none"
                stroke="#DCE8F1"
                stroke-opacity="0.024"
                stroke-width="1"
            />
        </pattern>

        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="18"/>
        </filter>
    </defs>

    <rect width="1920" height="1080" fill="url(#background)"/>
    <rect width="1920" height="1080" fill="url(#blueGlow)"/>
    <rect width="1920" height="1080" fill="url(#grid)"/>

    <path
        d="M 1040 -100 L 1390 -100 L 730 1180 L 380 1180 Z"
        fill="url(#darkMetal)"
    />

    <path
        d="M 1340 -120 L 1430 -120 L 780 1180 L 690 1180 Z"
        fill="url(#metal)"
    />

    <path
        d="M 1510 -100 L 1760 -100 L 1110 1180 L 860 1180 Z"
        fill="#B8C8D6"
        fill-opacity="0.025"
    />

    <path
        d="M 260 1080 L 0 1080 L 0 790 L 580 210 L 690 210 Z"
        fill="#A9BAC9"
        fill-opacity="0.032"
    />

    <path
        d="M 0 820 L 598 222"
        fill="none"
        stroke="url(#edge)"
        stroke-width="2"
    />

    <path
        d="M 920 1080 L 1515 485 L 1920 485"
        fill="none"
        stroke="#C5D4E0"
        stroke-opacity="0.13"
        stroke-width="2"
    />

    <path
        d="M 1220 1080 L 1710 590 L 1920 590"
        fill="none"
        stroke="#8298AB"
        stroke-opacity="0.09"
        stroke-width="1"
    />

    <path
        d="M 1180 238 L 1680 238"
        fill="none"
        stroke="#DCE6EF"
        stroke-opacity="0.10"
        stroke-width="1"
    />

    <path
        d="M 1405 -40 L 760 1140"
        fill="none"
        stroke="#D8E6F1"
        stroke-opacity="0.18"
        stroke-width="2"
    />

    <path
        d="M 1434 -40 L 789 1140"
        fill="none"
        stroke="#7C94A9"
        stroke-opacity="0.08"
        stroke-width="1"
    />

    <ellipse
        cx="1370"
        cy="260"
        rx="260"
        ry="160"
        fill="#4AAEE8"
        fill-opacity="0.025"
        filter="url(#softGlow)"
    />
</svg>